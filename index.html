<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrganizaAi · Lista de Tarefas</title>
    <link rel="stylesheet" href="assets/css/todolist.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <div id="authLoading" class="auth-loading" role="status" aria-live="polite">Carregando...</div>

    <div id="userMenu" class="user-menu" aria-label="Conta" hidden></div>

    <header class="brand" aria-label="OrganizaAi" hidden>
      <a
        class="brand-link"
        href="ChecklistAi/index.html"
        title="Ir para ChecklistAi"
        aria-label="OrganizaAi — ir para ChecklistAi"
      >
        <div class="avatar-ring"><span>OA</span></div>
        <h1>OrganizaAi</h1>
      </a>
    </header>

    <main class="todo-container" aria-label="Lista de tarefas" hidden>
      <div class="modal-mark" aria-hidden="true">
        <div class="avatar-ring"><span>OA</span></div>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="tarefaInput"
          placeholder="No que você está trabalhando?"
          aria-label="Nova tarefa"
        />
        <button id="addBtn" onclick="adicionarTarefa()">Adicionar</button>
      </div>

      <div id="count" aria-live="polite"></div>
      <div id="statusTarefas" class="form-message" role="status" aria-live="polite"></div>
      <div id="divFiltros"></div>
      <ul id="listaTarefas"></ul>
      <div id="divLimpar"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/todolist.js"></script>
  </body>
</html>
