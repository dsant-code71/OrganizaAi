<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrganizaAi · Lista de Tarefas</title>
    <link rel="stylesheet" href="todolist.css" />
  </head>
  <body>
    <header class="brand" aria-label="OrganizaAi">
      <div class="avatar-ring"><span>OA</span></div>
      <h1>OrganizaAi</h1>
    </header>

    <main class="todo-container" aria-label="Lista de tarefas">
      <div class="modal-mark" aria-hidden="true">
        <div class="avatar-ring"><span>OA</span></div>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="tarefaInput"
          placeholder="No que você está trabalhando?"
          aria-label="Nova tarefa"
        />
        <button id="addBtn" onclick="adicionarTarefa(), atualizarContador()">Adicionar</button>
      </div>

      <div id="count" aria-live="polite"></div>
      <div id="divFiltros"></div>
      <ul id="listaTarefas"></ul>
      <div id="divLimpar"></div>
    </main>

    <script src="todolist.js"></script>
  </body>
</html>
