<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrganizAI · Lista de Tarefas</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="todolist.css" />
  </head>
  <body>
    <header class="brand" aria-label="OrganizAI">
      <a
        class="brand-link"
        href="ia/index.html"
        title="Ir para o EstudAI"
        aria-label="OrganizAI — ir para o EstudAI"
      >
        <div class="avatar-ring"><span>OA</span></div>
        <h1>OrganizAI</h1>
      </a>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="Ativar modo escuro"
        aria-pressed="false"
        title="Ativar modo escuro"
      >
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main class="todo-container" aria-label="Lista de tarefas">
      <div class="modal-mark" aria-hidden="true">
        <div class="avatar-ring"><span>OA</span></div>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="tarefaInput"
          placeholder="No que você está trabalhando?"
          aria-label="Nova tarefa"
        />
        <button id="addBtn" onclick="adicionarTarefa(), atualizarContador()">Adicionar</button>
      </div>

      <div id="count" aria-live="polite"></div>
      <div id="divFiltros"></div>
      <ul id="listaTarefas"></ul>
      <div id="divLimpar"></div>
    </main>

    <script src="todolist.js"></script>
  </body>
</html>
