<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstudAI · Assistente de Estudos</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="ia.css" />
  </head>
  <body>
    <header class="brand" aria-label="EstudAI">
      <a class="brand-link" href="../index.html" title="Ir para a lista de tarefas (OrganizAI)" aria-label="EstudAI — ir para a lista de tarefas (OrganizAI)">
        <div class="avatar-ring"><span>EA</span></div>
        <h1>EstudAI</h1>
      </a>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="Ativar modo escuro"
        aria-pressed="false"
        title="Ativar modo escuro"
      >
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Tela de login -->
    <section id="loginScreen" class="login-screen" hidden>
      <div class="login-card">
        <div class="avatar-ring login-avatar"><span>EA</span></div>
        <h2>Assistente de Estudos</h2>
        <p>Tire dúvidas, peça explicações e organize seus estudos com ajuda da IA.</p>
        <button id="googleBtn" type="button" class="btn-google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/>
          </svg>
          Entrar com Google
        </button>
        <p id="loginMessage" class="login-message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- Aplicativo de chat -->
    <main id="chatApp" class="chat-app" hidden>
      <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

      <aside id="sidebar" class="sidebar" aria-label="Conversas">
        <div class="sidebar-header">
          <span class="sidebar-title">Conversas</span>
          <button id="newConversationBtn" type="button" class="btn-new" title="Nova conversa">
            + Nova
          </button>
        </div>
        <nav id="conversationsList" class="conversations-list"></nav>
        <div class="sidebar-footer">
          <span id="userEmail" class="user-email"></span>
          <button id="logoutBtn" type="button" class="btn-logout">Sair</button>
        </div>
      </aside>

      <section class="chat-main" aria-label="Conversa">
        <header class="chat-header">
          <button id="sidebarToggle" type="button" class="sidebar-toggle" aria-label="Abrir conversas" aria-controls="sidebar" aria-expanded="false">☰</button>
          <h2 id="chatTitle">EstudAI</h2>
        </header>

        <div class="messages-wrap">
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="emptyState" class="empty-state" hidden>
            <div class="avatar-ring empty-avatar"><span>EA</span></div>
            <h3>Como posso ajudar nos estudos?</h3>
            <p>Peça uma explicação, um resumo ou ajuda com um exercício.</p>
            <div class="suggestions">
              <button type="button" class="suggestion" data-prompt="Explique o Teorema de Pitágoras com um exemplo.">Teorema de Pitágoras</button>
              <button type="button" class="suggestion" data-prompt="Me ajude a montar um cronograma de estudos para a semana.">Cronograma de estudos</button>
              <button type="button" class="suggestion" data-prompt="Explique a diferença entre mitose e meiose.">Mitose x meiose</button>
            </div>
          </div>
        </div>

        <form id="composer" class="composer">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Pergunte alguma coisa sobre seus estudos..."
            aria-label="Mensagem"
            maxlength="4000"
          ></textarea>
          <button id="sendBtn" type="submit" class="btn-send" aria-label="Enviar mensagem">Enviar</button>
        </form>
      </section>
    </main>

    <script type="module" src="ia.js"></script>
  </body>
</html>
