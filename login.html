<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · OrganizaAi</title>
    <script src="assets/js/app-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="assets/js/icons.js"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card" aria-labelledby="loginTitulo">
      <div class="auth-brand">
        <div class="avatar-ring"><span>OA</span></div>
        <h1>OrganizaAi</h1>
        <p>Tarefas e assistente de estudos em um só lugar.</p>
      </div>

      <section id="secaoLogin" aria-labelledby="loginTitulo">
        <h2 id="loginTitulo">Entrar na sua conta</h2>
        <p class="auth-subtitle">Use sua conta Google para acessar o OrganizaAi e o EstudAI.</p>

        <div id="avisoLogin" class="notice" role="status" aria-live="polite" hidden></div>

        <button type="button" id="googleBtn" class="btn-google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/>
          </svg>
          <span id="googleBtnLabel">Entrar com Google</span>
        </button>

        <div id="mensagemLogin" class="form-message" role="status" aria-live="polite"></div>

        <p class="auth-footnote">
          Seu acesso é criado automaticamente no primeiro login.
        </p>
      </section>

      <div class="auth-links">
        <a href="index.html">OrganizaAi</a>
        <a href="ia/index.html">EstudAI</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
