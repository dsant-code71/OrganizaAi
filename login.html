<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · OrganizaAi</title>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card" aria-labelledby="loginTitulo">
      <div class="auth-brand">
        <div class="avatar-ring"><span>OA</span></div>
        <h1>OrganizaAi</h1>
        <p>Tarefas e assistente de estudos em um só lugar.</p>
      </div>

      <section id="secaoLogin" aria-labelledby="loginTitulo">
        <h2 id="loginTitulo">Entrar na sua conta</h2>
        <p class="auth-subtitle">Use sua conta Google para acessar o OrganizaAi e o EstudAI.</p>

        <div id="avisoLogin" class="notice" role="status" aria-live="polite" hidden></div>

        <button type="button" id="googleBtn" class="btn-primary">
          Entrar com Google
        </button>

        <div id="mensagemLogin" class="form-message" role="status" aria-live="polite"></div>

        <p class="auth-footnote">
          Seu acesso é criado automaticamente no primeiro login.
        </p>
      </section>

      <div class="auth-links">
        <a href="index.html">OrganizaAi</a>
        <a href="ia/index.html">EstudAI</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
